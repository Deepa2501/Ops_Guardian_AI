version: '3.8'

services:
  opsguardian:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsguardian-ai:latest
    container_name: opsguardian_control_center
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_PORT=8001
      - PYTHON_BIN=python
      - AI_PROVIDER=deterministic # change to 'gemini' if GEMINI_API_KEY is supplied
      - ARMORIQ_MODE=mock          # 'sdk' | 'mock' | 'disabled'
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ARMORIQ_API_KEY=${ARMORIQ_API_KEY:-}
      - DATABASE_URL=sqlite:///./data/opsguardian.db
    volumes:
      - opsguardian_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opsguardian_data:
    driver: local
